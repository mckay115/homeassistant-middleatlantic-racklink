# Integration Quality Scale tracking
# Honest assessment of what this custom integration implements.

rules:
  # Bronze
  action-setup:
    status: done
    comment: Entity services are registered by the switch platform.
  appropriate-polling: done
  brands:
    status: exempt
    comment: Custom integration distributed via HACS.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements; uses aiohttp/zeroconf shipped with Home Assistant.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: >
      Config flow, setup/unload, entities, services, diagnostics, and the
      controller command paths are covered; the raw socket/Redfish transport
      code is not yet.

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done  # per-outlet voltage sensors are disabled by default
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession: todo
  strict-typing:
    status: done
    comment: mypy passes with disallow_untyped_defs under pyproject.toml.

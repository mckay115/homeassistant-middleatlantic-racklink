name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate tag matches manifest version
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/middle_atlantic_racklink/manifest.json'))['version'])")

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match manifest version ($MANIFEST_VERSION)"
            exit 1
          fi
          echo "Version consistency validated: $TAG_VERSION"

      - name: Run tests
        run: |
          pytest tests/

      - name: Create release archive
        run: |
          cd custom_components/middle_atlantic_racklink
          zip -r ../../middle_atlantic_racklink.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.get_version.outputs.VERSION }}"
          files: middle_atlantic_racklink.zip
          generate_release_notes: true

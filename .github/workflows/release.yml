name: Release

on:
  push:
    branches: [main]
    paths: ["custom_components/middle_atlantic_racklink/manifest.json"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: racklink-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Read and validate version
        id: version
        run: |
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = json.loads(Path("custom_components/middle_atlantic_racklink/manifest.json").read_text())["version"]
          assert tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"] == version
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/"):
              assert ref == f"refs/tags/v{version}", "Tag does not match manifest version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Validate Python
        run: |
          black --check custom_components/middle_atlantic_racklink tests
          isort --check-only custom_components/middle_atlantic_racklink tests
          mypy custom_components/middle_atlantic_racklink
          pytest tests/ --timeout=60
      - name: Validate cards
        run: node --check custom_components/middle_atlantic_racklink/frontend/racklink-cards.js
      - name: Create release archive
        run: |
          cd custom_components/middle_atlantic_racklink
          zip -r ../../middle_atlantic_racklink.zip . -x '*/__pycache__/*' '*.pyc'
      - name: Publish versioned HACS release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          target_commitish: "${{ github.sha }}"
          name: "v${{ steps.version.outputs.version }}"
          files: middle_atlantic_racklink.zip
          generate_release_notes: true
